<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111217"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Rich Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe68a"/>
      <stop offset="35%" stop-color="#f4c84a"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a67812"/>
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe68a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f4c84a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7a5509" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Radial Amber Glow -->
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f4c84a" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#f4c84a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldBorder)" stroke-width="8"/>

  <!-- Football Jersey Crest -->
  <g filter="url(#shadow)">
    <!-- Authentic Jersey Silhouette -->
    <path d="M 172 135 
             L 218 135 
             C 236 172, 276 172, 294 135 
             L 340 135 
             L 426 195 
             L 374 265 
             L 340 240 
             L 340 405 
             C 340 420, 328 432, 312 432 
             L 200 432 
             C 184 432, 172 420, 172 405 
             L 172 240 
             L 138 265 
             L 86 195 
             Z" 
          fill="url(#goldGrad)"/>

    <!-- Collar Cutout & Sleeves -->
    <path d="M 218 135 C 236 172, 276 172, 294 135" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
    <line x1="86" y1="195" x2="138" y2="265" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
    <line x1="426" y1="195" x2="374" y2="265" stroke="#000000" stroke-width="9" stroke-linecap="round"/>

    <!-- Bold Centered Monogram "JJ" -->
    <text x="256" y="332" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="118" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#000000" 
          text-anchor="middle" 
          dominant-baseline="central">JJ</text>
  </g>

  <!-- Champion Star On Top -->
  <polygon points="256,60 267,82 291,85 273,102 278,126 256,114 234,126 239,102 221,85 245,82" 
           fill="url(#goldGrad)" 
           stroke="#ffe68a" 
           stroke-width="2"/>
</svg>

