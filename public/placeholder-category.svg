<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="catBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="50%" stop-color="#14161d"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="catGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="50%" stop-color="#f4c84a"/>
      <stop offset="100%" stop-color="#c9971a"/>
    </linearGradient>
    <radialGradient id="catGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f4c84a" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#f4c84a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="catShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#catBgGrad)"/>
  <circle cx="400" cy="380" r="320" fill="url(#catGlow)"/>

  <!-- Subtle Sport Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5">
    <circle cx="400" cy="400" r="280" fill="none"/>
    <circle cx="400" cy="400" r="180" fill="none"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
  </g>

  <!-- Central Folder / Trophy Icon -->
  <g filter="url(#catShadow)" transform="translate(400, 360)">
    <!-- Outer Shield / Emblem -->
    <path d="M 0 -120 L 110 -60 L 110 50 C 110 130, 0 180, 0 180 C 0 180, -110 130, -110 50 L -110 -60 Z" 
          fill="#131620" 
          stroke="url(#catGoldGrad)" 
          stroke-width="4"/>

    <!-- Inner Shield Inset -->
    <path d="M 0 -105 L 95 -50 L 95 45 C 95 115, 0 160, 0 160 C 0 160, -95 115, -95 45 L -95 -50 Z" 
          fill="#0c0e14" 
          stroke="#252a37" 
          stroke-width="2"/>

    <!-- Trophy / Star Emblem inside Shield -->
    <g transform="translate(0, 10)">
      <polygon points="0,-60 14,-20 54,-20 22,5 34,45 0,20 -34,45 -22,5 -54,-20 -14,-20" 
               fill="url(#catGoldGrad)"/>
      <circle cx="0" cy="-5" r="8" fill="#0c0e14"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 640)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" 
          font-weight="900" 
          fill="url(#catGoldGrad)" 
          letter-spacing="6" 
          text-anchor="middle">JERSEY JUNCTION</text>
    <text x="0" y="30" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="700" 
          fill="#9ca3af" 
          letter-spacing="4" 
          text-anchor="middle">OFFICIAL CATEGORY</text>
  </g>
</svg>
